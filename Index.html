<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="painel-versao" content="v5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coleta biométrica na 1ª habilitação</title>
<link href="https:&#47;&#47;fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('carregando');
  if (!box || !e || !e.message || window.erroJaMostrado) return;
  window.erroJaMostrado = true;
  var trechos = [];
  function corta(linha) { var c = e.colno || 0; return linha.slice(Math.max(0, c - 90), c + 90).replace(/\s+/g, ' '); }
  try {
    var ss = document.getElementsByTagName('script');
    for (var k = 0; k < ss.length; k++) {
      var ls = (ss[k].text || '').split('\n');
      if (e.lineno && ls.length > e.lineno) trechos.push('bloco ' + (k + 1) + ', ' + ls.length + ' linhas: [' + corta(ls[e.lineno - 1]) + '] e, uma antes: [' + corta(ls[e.lineno - 2] || '') + ']');
    }
  } catch (x) {}
  document.body.className = 'aguardando'; box.hidden = false; box.className = 'carregando erro';
  box.textContent = 'A página encontrou um erro e não terminou de abrir (painel v5). Detalhe: ' + e.message + ' (linha ' + (e.lineno || '?') + ', coluna ' + (e.colno || '?') + '). ' + (trechos.length ? 'Trecho do código: ' + trechos.join(' | ') : '');
});
</script>
<style>
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --ink:#14284B; --text:#1F2937; --muted:#5B6678; --line:#D9DEE7; --soft:#F3F6FB;
  --navy:#14284B; --blue:#2F5597; --zebra:#FBF7EE; --pill:#14284B;
  --g1:#C8372D; --g2:#E67E22; --g3:#2F5597; --g4:#2E9E5B; --g5:#8A93A3;
  --focus:#E67E22;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1524; --surface:#162136; --ink:#E8EDF7; --text:#DCE3EF; --muted:#9AA7BD; --line:#2A3855; --soft:#1C2A45;
    --zebra:#1A2640; --g3:#7FA3E6; --g5:#8F9BB0; --pill:#3A66B3;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#162136; --ink:#E8EDF7; --text:#DCE3EF; --muted:#9AA7BD; --line:#2A3855; --soft:#1C2A45;
  --zebra:#1A2640; --g3:#7FA3E6; --g5:#8F9BB0; --pill:#3A66B3;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Lato,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 40px}

.top{background:linear-gradient(100deg,#14284B 0%,#24457F 70%,#2F5597 100%);color:#fff}
.top .wrap{padding-top:22px;padding-bottom:22px;display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:24px;align-items:end}
.top h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.top p{margin:6px 0 0;color:#C9D6EE;font-size:15px}
.kpis{display:flex;flex-wrap:wrap;gap:10px 0}
.kpi{padding:2px 22px;border-left:1px solid rgba(255,255,255,.22)}
.kpi b{display:block;font-size:30px;font-weight:900;line-height:1.1}
.kpi span{font-size:13px;color:#C9D6EE}
.kpi.hot b{color:#FFC978}
button.kpi{background:none;border:0;border-left:1px solid rgba(255,255,255,.22);text-align:left;color:#fff;cursor:pointer;font:inherit;border-radius:0 8px 8px 0}
button.kpi:hover{background:rgba(255,255,255,.1)}
button.kpi span{text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-top:16px}
.tablist{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tablist button{border:0;background:none;padding:9px 18px;border-radius:9px;font-weight:900;font-size:15.5px;color:var(--muted);cursor:pointer}
.tablist button[aria-selected="true"]{background:var(--pill);color:#fff}
.base{font-size:13px;color:var(--muted)}
.go{margin-top:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;color:var(--ink)}
.go:hover{border-color:var(--blue)}
.cross{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.cross b{color:var(--ink)}
.visits{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);margin-top:2px}
.visits b{color:var(--ink)}
.main .left, .main .right{grid-column:auto}
.main.sup{grid-template-areas:"map table" "detail drill"}
.main.sup .left{display:contents}
.main.sup .map{grid-area:map}
.main.sup .detail{grid-area:detail;align-self:start}
.main.sup .right{grid-area:table;min-height:0}
.tools{display:flex;gap:8px;align-items:center;flex:1 1 260px;justify-content:flex-end}
.tools .search{flex:1 1 150px}
.exp{flex:none;border:1.5px solid var(--pill);background:var(--pill);color:#fff;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.exp:hover{filter:brightness(1.15)}
.expmsg{flex:1 1 100%;margin:0;font-size:13px;color:var(--muted);text-align:right}
.expmsg:empty{display:none}
.panel.drill{grid-area:drill;border-top:4px solid var(--focus);min-width:0;align-self:start}
.drill .scroll{max-height:520px}
.drill .bar{width:68px}
.drill table{min-width:540px}
.drill th.rk2 button{white-space:nowrap;line-height:1.15;padding-top:5px;padding-bottom:5px}
.drill th small{display:block;font-weight:400;font-size:11px;white-space:nowrap}
.crit label[hidden]{display:none}
.sum .nums b.red{color:var(--g1)}
.panel.crit3{padding:16px 18px;border-left:5px solid var(--g1);margin-bottom:16px}
.crit3 h3{font-size:18px}
.chips3{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips3 span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 11px 5px 5px;font-size:13.5px;font-weight:700;color:var(--ink);background:var(--surface)}
.chips3 b{min-width:26px;text-align:center;background:var(--g1);color:#fff;border-radius:6px;padding:2px 6px;font-weight:900}
.foot.plusgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:0}
.foot.plusgrid .panel{padding:0}
.foot.plusgrid table{min-width:440px}
th span{display:block;padding:9px 10px;white-space:nowrap}
tbody.plain tr{cursor:default}
tbody.plain tr:hover{background:transparent}
tbody.plain tr:nth-child(even):hover{background:var(--zebra)}
[hidden]{display:none !important}
body.aguardando .tabs, body.aguardando #tabA{display:none}
.carregando{margin:28px 0;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:16px;font-weight:700;color:var(--ink)}
.carregando.erro{border-left:5px solid var(--g1);font-weight:400;max-width:75ch}

.ask{padding:16px 0 6px}
.ask h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--muted)}
.views{display:flex;flex-wrap:wrap;gap:8px}
.views button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer}
.views button:hover{border-color:var(--blue)}
.views button[aria-pressed="true"]{background:var(--pill);border-color:var(--pill);color:#fff}
.sum{margin:14px 0 14px;display:flex;flex-wrap:wrap;gap:6px 26px;align-items:baseline}
.sum .desc{flex:1 1 380px;color:var(--text);font-size:15px}
.sum .nums{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:14px;color:var(--muted)}
.sum .nums b{color:var(--ink);font-size:17px;font-weight:900;margin-right:4px}

.main{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:16px;align-items:stretch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel h3{margin:0;font-size:16px;font-weight:900;color:var(--ink)}
.panel .hint{margin:2px 0 0;font-size:13px;color:var(--muted)}
.left{display:flex;flex-direction:column;gap:16px;min-width:0}
.map{padding:16px 16px 10px;position:relative}
.map svg{display:block;width:100%;height:auto;margin-top:8px;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.legend button{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:none;padding:4px 9px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--text)}
.legend button:hover{border-color:var(--line)}
.legend button[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:8px 11px;border-radius:8px;font-size:13px;line-height:1.4;white-space:nowrap;z-index:5;transform:translate(-50%,-100%);margin-top:-12px;display:none;box-shadow:0 6px 18px rgba(10,20,45,.28)}
.tip b{display:block;font-size:14px}

.detail{padding:16px}
.detail .who{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.detail h3{font-size:20px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 10px}
.stat em{display:block;font-style:normal;font-weight:700;font-size:12.5px;color:var(--ink);margin-top:2px}
.stat{background:var(--soft);border-radius:8px;padding:9px 12px}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--ink);line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted)}
.split{height:12px;border-radius:6px;background:var(--g4);overflow:hidden;display:flex;justify-content:flex-end}
.split i{display:block;height:100%;background:var(--g1)}
.splitkey{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
.pos{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;font-size:13.5px;color:var(--muted)}
.pos b{color:var(--ink)}
.sacs{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.sacs h4{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--ink)}
.days{display:flex;align-items:flex-end;gap:2px;height:44px;margin-bottom:2px}
.days i{flex:1;background:var(--blue);border-radius:2px 2px 0 0;min-height:1px;opacity:.9}
.days i.z{background:var(--line)}
.dayaxis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.protos{display:flex;flex-wrap:wrap;gap:5px;max-height:104px;overflow:auto}
.protos span{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.protos span em{font-style:normal;color:var(--muted);margin-left:5px}

.right{position:relative;min-height:520px;min-width:0}
.right-in{position:absolute;inset:0;display:flex;flex-direction:column}
.thead{padding:14px 16px 10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.search{flex:1 1 180px;max-width:280px;border:1.5px solid var(--line);border-radius:8px;padding:7px 11px;background:var(--surface)}
.scroll{overflow:auto;flex:1;border-top:1px solid var(--line);border-radius:0 0 10px 10px}
table{border-collapse:collapse;width:100%;min-width:500px;font-size:14px}
th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:0;text-align:right;z-index:2}
th button{all:unset;display:block;width:100%;white-space:nowrap;padding:9px 10px;cursor:pointer;box-sizing:border-box;text-align:inherit}
th button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
th[aria-sort="ascending"] button::after{content:" ▲";font-size:10px}
th[aria-sort="descending"] button::after{content:" ▼";font-size:10px}
th[aria-sort] {background:#E67E22}
th.l{text-align:left}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.l{text-align:left;white-space:normal}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--soft)}
tbody tr[aria-selected="true"]{background:var(--soft);box-shadow:inset 4px 0 0 var(--focus)}
tbody tr[aria-selected="true"] td.l{font-weight:900}
.cell{display:flex;align-items:center;gap:8px}
.rk{flex:none;min-width:26px;text-align:center;font-weight:900;font-size:12.5px;color:var(--ink)}
tr.t3 .rk{background:var(--pill);color:#fff;border-radius:5px;padding:1px 0}
.nm{font-weight:700;color:var(--ink)}
.bar{position:relative;display:inline-block;width:78px;height:20px;vertical-align:middle;text-align:right}
.bar i{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;opacity:.62}
.bar b{position:relative;font-weight:700;line-height:20px;padding-right:4px;color:var(--text);text-shadow:0 0 3px var(--surface),0 0 3px var(--surface)}
.empty{padding:28px 16px;color:var(--muted)}

.foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;margin-top:16px}
.foot .panel{padding:16px}
.crit{display:grid;gap:10px;margin-top:12px}
.crit label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.crit input{width:92px;text-align:center;font-weight:900;color:var(--navy);background:#FFF2CC;border:1.5px solid #E9D48A;border-radius:7px;padding:6px}
.reset{margin-top:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;color:var(--ink)}
.notes{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--text)}
.notes li{margin:5px 0;max-width:75ch}
.src{margin-top:14px;font-size:12.5px;color:var(--muted)}

@media (max-width:980px){
  .top .wrap{grid-template-columns:1fr}
  .kpi{padding:2px 16px;flex:1 1 40%}
  .main,.foot,.foot.plusgrid{grid-template-columns:minmax(0,1fr)}
  .main.sup{grid-template-areas:"map" "table" "detail" "drill"}
  .right{min-height:0}
  .right-in{position:static}
  .scroll{max-height:70vh}
}
@media (max-width:560px){
  .wrap{padding:0 14px 32px}
  .top h1{font-size:23px}
  .kpi b{font-size:25px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .views button{padding:8px 13px;font-size:14px}
}
@media (prefers-reduced-motion:no-preference){
  .pt{transition:opacity .2s}
}
</style>
</head>
<body class="aguardando">
<header class="top">
  <div class="wrap">
    <div>
      <h1>Coleta biométrica na 1ª habilitação</h1>
      <p id="sub">Postos Poupatempo e unidades CIR</p>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</header>

<div class="wrap">
  <p class="carregando" id="carregando" role="status">Abrindo o painel…</p>
  <noscript><p class="carregando erro">O navegador está com o JavaScript desligado, e o painel precisa dele para abrir.</p></noscript>
  <div class="tabs">
    <div class="tablist" role="tablist" aria-label="Nível de análise" id="tabs">
      <button role="tab" data-m="p">Postos</button>
      <button role="tab" data-m="s">Superintendências</button>
    </div>
  </div>
  <div id="tabA">
  <section class="ask" aria-label="Escolha o que ver">
    <h2>O que você quer ver?</h2>
    <div class="views" id="views"></div>
  </section>
  <div class="sum" aria-live="polite">
    <div class="desc" id="desc"></div>
    <div class="nums" id="nums"></div>
  </div>

  <div class="main">
    <div class="left">
      <section class="panel map" id="mapbox">
        <h3 id="maptitle">Mapa dos postos: volume e taxa</h3>
        <p class="hint" id="maphint"></p>
        <div id="svgbox"></div>
        <div class="legend" id="legend"></div>
        <div class="tip" id="tip"></div>
      </section>
      <section class="panel detail" id="detail" aria-live="polite"></section>
    </div>

    <section class="panel right">
      <div class="right-in">
        <div class="thead">
          <div>
            <h3 id="ttitle">Postos</h3>
            <p class="hint" id="tabhint"></p>
          </div>
          <div class="tools">
            <input class="search" id="q" type="search" placeholder="Buscar posto" aria-label="Buscar posto pelo nome">
            <button class="exp" id="exp" hidden title="Exporta para Excel a tabela como está na tela, com o filtro e a ordem atuais">Exportar tabela</button>
          </div>
          <p class="expmsg" id="expmsg" role="status" aria-live="polite"></p>
        </div>
        <div class="scroll" tabindex="0" aria-label="Tabela de postos">
          <table>
            <thead><tr id="hrow"></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty" hidden></div>
        </div>
      </div>
    </section>

  <section class="panel drill" id="drill" hidden>
    <div class="thead"><div><h3 id="dtitle"></h3><p class="hint" id="dhint"></p></div>
      <button class="exp" id="dexp" hidden title="Exporta para Excel os postos desta superintendência, na ordem atual">Exportar postos</button></div>
    <div class="scroll" tabindex="0" aria-label="Ranking dos postos da superintendência">
      <table><thead><tr id="dhrow"></tr></thead><tbody id="drows"></tbody></table>
    </div>
  </section>

  </div>

  <div class="foot">
    <section class="panel">
      <h3>Critérios dos grupos</h3>
      <p class="hint">Mude um valor e o mapa, os grupos e as listas se ajustam.</p>
      <div class="crit">
        <label><span id="lVol"></span> <input id="cVol" type="number" min="1" step="1" inputmode="numeric"></label>
        <label><span>Taxa de corte, em % (padrão: média do Estado)</span> <input id="cTax" type="number" min="0" max="100" step="0.1" inputmode="decimal"></label>
        <label id="rowMin"><span id="lMin"></span> <input id="cMin" type="number" min="1" step="1" inputmode="numeric"></label>
        <label><span>Referência: taxa sem RENACH de até (%)</span> <input id="cRef" type="number" min="0" max="100" step="1" inputmode="numeric"></label>
      </div>
      <button class="reset" id="reset">Voltar ao padrão</button>
    </section>
    <section class="panel">
      <h3>Como ler os números</h3>
      <ul class="notes" id="notes"></ul>
      <p class="src" id="src"></p>
    </section>
  </div>
  </div>


</div>

<script>
function iniciar(DADOS) {
  const RAW = DADOS.postos;
  const SUPS = DADOS.sups;
  const CIR = [];
  const SACS = DADOS.sacs;
  const DIAS = DADOS.periodo.dias;
  const MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"][DADOS.periodo.mes - 1];
  const MES3 = MES.slice(0, 3), MM = String(DADOS.periodo.mes).padStart(2, "0"), PER = MES + " de " + DADOS.periodo.ano;
  const AVISOS = DADOS.avisos || [];
  document.getElementById("sub").textContent = "Postos Poupatempo e unidades CIR, " + PER;
  const $ = (id) => document.getElementById(id);
  const nf = (n) => n.toLocaleString("pt-BR");
  const pf = (t, d = 1) => (t * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const MIN = new Set(["de", "do", "da", "dos", "das", "e"]);
  function tidy(name) {
    const SIGLA = new Set(["PPT", "CIR", "SSP"]), ws = name.split(" ");
    let k = 0;
    while (k < ws.length - 1 && SIGLA.has(ws[k])) k++;
    const rest = ws.slice(k).join(" ");
    if (rest !== rest.toUpperCase()) return name;
    return ws.slice(0, k).concat(rest.toLowerCase().split(" ").map((w, i) => i && MIN.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1))).join(" ");
  }
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  function mix(a, b, t) {

    const P = MODES.p, crit = (c) => "muito volume a partir de ".concat(nf(c.vol), " coletas; taxa de corte de ").concat(pf(c.tax)) + (c.min > 0 ? "; mínimo de ".concat(nf(c.min), " coletas para avaliar a taxa") : "") + "; referência com taxa de até ".concat(pf(c.ref, 0));
    const NOMES = { nome: "nome", vol: "coletas", bad: "sem RENACH", tx: "taxa sem RENACH", z: "SACs", rk: "posição no Estado" };
    let rows, info, nome, widths, pct;
    if (kind === "drill") {
      const sp = sups[m.sel], list = drillList(sp), [sk, sd] = DR.sort, rk = RK[DR.rk];
      rows = [
        ["Posição", "Posto", "Superintendência", "Coletas", "Com RENACH", "Sem RENACH", "Taxa sem RENACH", "SACs", "Posição no Estado (".concat(rk.t, ")"), "Grupo"],
        ...list.map((p, k) => [k + 1, p.nome, sp.nome, p.vol, p.com, p.bad, p.tx, p.z, p[rk.f], GPOSTO[p.g]])
      ];
      widths = [9, 38, 26, 10, 13, 13, 16, 8, 30, 36];
      pct = [6];
      info = [
        ["Aba", "Superintendências"],
        ["Tabela", "Postos de ".concat(sp.nome)],
        ["Ordenação", "".concat(NOMES[sk], ", ").concat(sd > 0 ? "crescente" : "decrescente")],
        ["Posição no Estado", "Posição do posto entre os ".concat(nf(base.length), " do Estado ").concat(rk.frase, ".")],
        ["Linhas", list.length],
        ["Critérios dos postos", crit(P.C)]
      ];
      nome = "coleta-biometrica_postos-de-".concat(slug(sp.nome));
    } else {
      const list = currentList(), S = m.S, [sk, sd] = S.sort || VIEWS[S.view].sort, visao = S.q ? "Busca" : VIEWS[S.view].label();
      if (m.id === "s") {
        rows = [
          ["Posição", "Superintendência", "Postos", "Coletas", "Com RENACH", "Sem RENACH", "Taxa sem RENACH", "SACs", "Grupo"],
          ...list.map((p, k) => [k + 1, p.nome, p.postos.length, p.vol, p.com, p.bad, p.tx, p.z, gname(p.g)])
        ];
        widths = [9, 30, 9, 10, 13, 13, 16, 8, 36];
        pct = [6];
      } else {
        rows = [
          ["Posição", "Posto", "Superintendência", "Coletas", "Com RENACH", "Sem RENACH", "Taxa sem RENACH", "SACs", "Grupo"],
          ...list.map((p, k) => [k + 1, p.nome, sups[p.sup].nome, p.vol, p.com, p.bad, p.tx, p.z, gname(p.g)])
        ];
        widths = [9, 38, 26, 10, 13, 13, 16, 8, 36];
        pct = [6];
      }
      info = [
        ["Aba", m.id === "s" ? "Superintendências" : "Postos"],
        ["Visão", visao],
        ["Descrição", S.q ? 'Busca por "'.concat(S.q, '" ').concat(m.emTodos, ".") : VIEWS[S.view].desc()],
        ["Ordenação", "".concat(NOMES[sk], ", ").concat(sd > 0 ? "crescente" : "decrescente")],
        ["Linhas", list.length],
        ["Critérios", crit(m.C)]
      ];
      nome = "coleta-biometrica_".concat(m.id === "s" ? "superintendencias" : "postos", "_").concat(slug(visao));
    }
    const sobre = [
      ["Painel", "Coleta biométrica na 1ª habilitação, postos Poupatempo e unidades CIR, " + PER],
      ...info,
      ["Fonte", "Abas Coletas e SACs da planilha" + (DADOS.lidoEm ? ", lidas em " + DADOS.lidoEm : "") + "."]
    ];
    return { filename: nome + ".xlsx", data: xlsx([{ name: "Tabela", rows, pct, widths, table: true }, { name: "Filtro usado", rows: sobre, widths: [22, 110] }]), linhas: rows.length - 1 };
  }
  let DL = null;
  const SOLTO = true;
  const expMsg = (t) => {
    $("expmsg").textContent = t;
  };
  function baixarDireto(arq) {
    const url = URL.createObjectURL(new Blob([arq.data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = arq.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4e3);
  }
  async function exportar(kind) {
    if (!DL && !SOLTO) return;
    const arq = montarExport(kind);
    if (!arq.linhas) {
      expMsg("A tabela está vazia, não há o que exportar.");
      return;
    }
    if (!DL) {
      baixarDireto(arq);
      expMsg("Tabela exportada com ".concat(nf(arq.linhas), " ").concat(arq.linhas === 1 ? "linha" : "linhas", "."));
      return;
    }
    try {
      await DL.save({ filename: arq.filename, data: arq.data });
      expMsg("Tabela exportada com ".concat(nf(arq.linhas), " ").concat(arq.linhas === 1 ? "linha" : "linhas", "."));
    } catch (e) {
      const c = e && e.code;
      if (c === "declined") expMsg("Exportação cancelada.");
      else if (c === "rate_limited") expMsg("Já há uma exportação aguardando confirmação. Aguarde um instante e tente de novo.");
      else if (c === "too_large" || c === "bad_request" || c === "transform_error") expMsg("Não foi possível gerar o arquivo desta tabela.");
      else if (c === "rejected_extension" || c === "extension_not_enabled") expMsg("A exportação para Excel não está disponível nesta visualização.");
      else {
        DL = null;
        $("exp").hidden = !SOLTO;
        $("dexp").hidden = !SOLTO;
        expMsg("A exportação não está disponível nesta visualização.");
      }
    }
  }
  $("exp").addEventListener("click", () => exportar("main"));
  $("dexp").addEventListener("click", () => exportar("drill"));
  (window.claude && typeof window.claude.use === "function" ? window.claude.use("downloads") : Promise.resolve(null)).then((d) => {
    DL = d || null;
    $("exp").hidden = !(DL || SOLTO);
    $("dexp").hidden = !(DL || SOLTO);
  }).catch(() => {
  });
  if (SOLTO) {
    $("exp").hidden = false;
    $("dexp").hidden = false;
  }
  function render(how) {
    classify(MODES.p);
    classify(MODES.s);
    $("expmsg").textContent = "";
    const list = currentList();
    if (how === "top" || m.sel == null || how === "in" && !list.some((p) => p.i === m.sel)) m.sel = list.length ? list[0].i : m.sel;
    drawViews();
    drawSummary(list);
    drawMap(list);
    drawTable(list);
    drawDetail();
    drawDrill();
    drawNotes();
  }
  function syncInputs() {
    $("cVol").value = m.C.vol;
    $("cTax").value = (m.C.tax * 100).toFixed(1);
    $("cMin").value = m.C.min;
    $("cRef").value = Math.round(m.C.ref * 100);
    $("q").value = m.S.q;
  }
  function select(i, fromTable) {
    m.sel = i;
    const list = currentList();
    drawMap(list);
    drawTable(list);
    drawDetail();
    drawDrill();
    const d = $("detail").getBoundingClientRect();
    if (fromTable && (d.bottom < 0 || d.top > innerHeight)) $("detail").scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  const resetView = () => {
    const S = m.S;
    S.grp = null;
    S.sort = null;
    S.q = "";
    $("q").value = "";
  };
  $("views").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    resetView();
    m.S.view = b.dataset.v;
    render("top");
  });
  $("legend").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    resetView();
    m.S.view = "grp";
    m.S.grp = +b.dataset.g;
    render("top");
  });
  $("hrow").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const k = b.dataset.k, cur = m.S.sort || VIEWS[m.S.view].sort;
    m.S.sort = [k, cur[0] === k ? -cur[1] : k === "nome" ? 1 : -1];
    render("in");
  });
  $("rows").addEventListener("click", (e) => {
    const r = e.target.closest("tr");
    if (r) select(+r.dataset.i, true);
  });
  $("rows").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const r = e.target.closest("tr");
    if (r) {
      e.preventDefault();
      select(+r.dataset.i, true);
      const n = $("rows").querySelector('tr[data-i="'.concat(r.dataset.i, '"]'));
      if (n) n.focus();
    }
  });
  $("q").addEventListener("input", (e) => {
    const S = m.S;
    S.q = e.target.value.trim();
    if (S.q && S.view !== "all") {
      S.view = "all";
      S.grp = null;
      S.sort = null;
    }
    render("in");
  });
  const tip = $("tip");
  $("svgbox").addEventListener("click", (e) => {
    const c = e.target.closest(".pt");
    if (c) select(+c.dataset.i, false);
  });
  $("svgbox").addEventListener("pointermove", (e) => {
    const c = e.target.closest(".pt");
    if (!c) {
      tip.style.display = "none";
      return;
    }
    const p = m.rows[+c.dataset.i], box = $("mapbox").getBoundingClientRect(), r = c.getBoundingClientRect();
    tip.innerHTML = "<b>".concat(esc(p.nome), "</b>").concat(nf(p.vol), " coletas, ").concat(nf(p.bad), " sem RENACH (").concat(pf(p.tx), ")<br>").concat(nf(p.z), " ").concat(p.z === 1 ? "SAC" : "SACs", " no mês").concat(m.id === "s" ? ", ".concat(nf(p.postos.length), " ").concat(p.postos.length === 1 ? "posto" : "postos") : "");
    tip.style.display = "block";
    const half = tip.offsetWidth / 2, cx = r.left + r.width / 2 - box.left;
    tip.style.left = Math.min(box.width - half - 6, Math.max(half + 6, cx)) + "px";
    tip.style.top = r.top - box.top + "px";
  });
  $("svgbox").addEventListener("pointerleave", () => tip.style.display = "none");
  function readInputs() {
    const C = m.C, v = parseFloat($("cVol").value), t = parseFloat($("cTax").value), mn = parseFloat($("cMin").value), r = parseFloat($("cRef").value);
    if (v >= 1) C.vol = Math.round(v);
    if (mn >= 1) C.min = Math.round(mn);
    if (t >= 0 && t <= 100) C.tax = Math.abs(t - +(m.DEF.tax * 100).toFixed(1)) < 1e-9 ? m.DEF.tax : t / 100;
    if (r >= 0 && r <= 100) C.ref = r / 100;
    render("in");
  }
  ["cVol", "cTax", "cMin", "cRef"].forEach((id) => $(id).addEventListener("input", readInputs));
  $("reset").addEventListener("click", () => {
    Object.assign(m.C, m.DEF);
    syncInputs();
    render("in");
  });
  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b && b.dataset.m !== m.id) abrir(b.dataset.m);
  });
  $("dhrow").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const k = b.dataset.k;
    if (RK[k]) DR.rk = k;
    DR.sort = [k, DR.sort[0] === k ? -DR.sort[1] : k === "nome" || k === "rk" ? 1 : -1];
    drawDrill();
  });
  const irPosto = (r) => {
    if (!r) return;
    abrir("p", +r.dataset.i);
    scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  };
  $("drows").addEventListener("click", (e) => irPosto(e.target.closest("tr")));
  $("drows").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      irPosto(e.target.closest("tr"));
    }
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render("keep"));
  new MutationObserver(() => render("keep")).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  abrir("p");
  let lastW = $("svgbox").clientWidth;
  new ResizeObserver(() => {
    const w = $("svgbox").clientWidth;
    if (Math.abs(w - lastW) > 8) {
      lastW = w;
      drawMap(currentList());
    }
  }).observe($("svgbox"));
}
(function() {
  const box = document.getElementById("carregando");
  const falha = (msg) => {
    document.body.classList.add("aguardando");
    box.hidden = false;
    box.className = "carregando erro";
    box.textContent = msg;
  };
  let chamado = false;
  window.abrirPainel = function(DADOS) {
    chamado = true;
    if (!DADOS) {
      falha("O script não entregou os dados da planilha. Rode Dashboard > Conferir dados para ver o motivo.");
      return;
    }
    if (DADOS.erro) {
      falha("Não foi possível ler a planilha. " + DADOS.erro);
      return;
    }
    try {
      document.body.classList.remove("aguardando");
      box.hidden = true;
      iniciar(DADOS);
    } catch (e) {
      falha("A página encontrou um erro ao montar o painel. Detalhe: " + (e && e.message ? e.message : e));
    }
  };
  const conferir = () => {
    if (!chamado) falha("Os dados não chegaram. Esta página só funciona aberta pelo Apps Script (menu Dashboard da planilha ou endereço do app da Web), com o Code.gs e o Index da mesma versão.");
  };
  window.addEventListener("load", conferir);
  setTimeout(conferir, 4e3);
})();
</script>
